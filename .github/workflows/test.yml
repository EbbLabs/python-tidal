name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'
      - run: poetry env use python
      - run: poetry install
      # Offline tests only, the remaining tests require a TIDAL account
      - run: poetry run pytest tests/test_backoff.py tests/test_parsing.py tests/test_token_refresh.py
