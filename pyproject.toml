[project]
name = "tidalapi"
version = "0.9.0"
description = "Unofficial API for TIDAL music streaming service."
authors = [{ name = "Thomas Amland", email = "thomas.amland@googlemail.com" }]
maintainers = [
    { name = "tehkillerbee", email = "tehkillerbee@users.noreply.github.com" },
]
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.3,<3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "isodate>=0.7.2,<0.8.0",
    "mpegdash>=0.4.1,<0.5.0",
]
dynamic = ["readme"]

[project.urls]
Homepage = "https://tidalapi.netlify.app"
Repository = "https://github.com/EbbLabs/python-tidal"
Documentation = "https://tidalapi.netlify.app"

[tool.poetry]
readme = ["README.rst", "HISTORY.rst"]

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.0"
types-python-dateutil = "^2.8.19.13"
types-requests = "^2.31.0.1"
pytest = "^9.1.1"
keyring = "^25.7.0"
pillow = ">=10.0.0"
tox = "^4.6.4"
ffmpeg-python = "^0.2.0"
black = "^26.10.1"
isort = "^9.0.2"
ruff = "^0.17.0"
docformatter = { extras = ["tomli"], version = "^1.7.3" }
pytest-mock = "^3.11.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
check_untyped_defs = true
packages = "tidalapi"

[tool.isort]
profile = "black"

[tool.docformatter]
recursive = true
black = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
